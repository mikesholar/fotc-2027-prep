<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b24"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff6a6"/>
      <stop offset="1" stop-color="#33b768"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#54e087" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#54e087" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <g stroke-linecap="round">
    <!-- sleeve rod -->
    <rect x="104" y="244" width="304" height="24" rx="12" fill="#d7dde5"/>
    <!-- end caps -->
    <rect x="94" y="230" width="20" height="52" rx="10" fill="#aeb7c2"/>
    <rect x="398" y="230" width="20" height="52" rx="10" fill="#aeb7c2"/>

    <!-- left plates -->
    <rect x="150" y="164" width="34" height="184" rx="16" fill="url(#plate)"/>
    <rect x="122" y="196" width="26" height="120" rx="12" fill="url(#plate)" opacity="0.85"/>
    <!-- right plates -->
    <rect x="328" y="164" width="34" height="184" rx="16" fill="url(#plate)"/>
    <rect x="364" y="196" width="26" height="120" rx="12" fill="url(#plate)" opacity="0.85"/>

    <!-- center bar highlight -->
    <rect x="196" y="242" width="120" height="28" rx="14" fill="#f2f6fa"/>
  </g>
</svg>
